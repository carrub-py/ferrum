<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
    background: #050507;
    cursor: col-resize;
    user-select: none;
    -webkit-user-select: none;
    display: grid;
    place-items: center;
  }
  .line {
    width: 2px;
    height: 100%;
    background: rgba(255, 255, 255, 0.08);
    transition: background 140ms ease, width 140ms ease;
  }
  body:hover .line, body.dragging .line {
    width: 3px;
    background: rgba(255, 255, 255, 0.34);
  }
</style>
</head>
<body>
<div class="line" title="Arrastra para ajustar Vista Dividida · Doble clic para centrar 50/50"></div>
<script>
  const send = (p) => { try { window.ipc.postMessage(JSON.stringify(p)); } catch (_) {} };
  let dragging = false;
  let lastX = 0;

  window.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (e.detail === 2) {
      send({ cmd: 'set_split_ratio', ratio: 0.5 });
      return;
    }
    dragging = true;
    lastX = e.screenX;
    document.body.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const dx = e.screenX - lastX;
    if (Math.abs(dx) >= 2) {
      lastX = e.screenX;
      send({ cmd: 'resize_split_delta', dx });
    }
  });

  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    document.body.classList.remove('dragging');
  });
</script>
</body>
</html>
