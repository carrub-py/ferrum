[package]
name = "ferrum-browser"
version = "0.5.0"
edition = "2024"
description = "Navegador web de escritorio en Rust: minimalismo Apple Obsidian, motor adblock-rust, contenedores aislados, bóveda cifrada, vista dividida y actualizaciones SHA-256"
license = "MIT"
repository = "https://github.com/carrub-py/ferrum"

[dependencies]
tao = "0.37"
wry = { version = "0.57", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
dirs = "7.0"
http = "1.1"
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
ureq = "3.5"
argon2 = "0.6"
aes-gcm = "0.11"
base64 = "0.23"
getrandom = "0.4"
sha2 = "0.10"
zeroize = "1.8"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
