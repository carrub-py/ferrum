name: Release Windows Binary

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting, lints, and tests
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build optimized Windows release binary
        shell: pwsh
        run: cargo build --release

      - name: Package portable release & generate SHA256SUMS.txt
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\ferrum-browser.exe" "dist\ferrum-browser.exe"

          $stage = "dist\zip_stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "dist\ferrum-browser.exe" "$stage\ferrum-browser.exe"
          Copy-Item "README.md" "$stage\README.md"
          Copy-Item "LICENSE" "$stage\LICENSE"
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\ferrum-browser-windows-x64.zip" -Force
          Remove-Item -Recurse -Force $stage

          $exeHash = (Get-FileHash -Path "dist\ferrum-browser.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Path "dist\ferrum-browser-windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $sums = "$exeHash  ferrum-browser.exe`n$zipHash  ferrum-browser-windows-x64.zip`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) "dist\SHA256SUMS.txt"), $sums, [System.Text.UTF8Encoding]::new($false))
          Get-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ferrum-browser.exe
            dist/ferrum-browser-windows-x64.zip
            dist/SHA256SUMS.txt
